<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Учебный портал: Проекты</title>
  <meta name="description" content="Учебная страница управления проектами, сметами и заказами с возможностью поиска, создания и сохранения.">
  <link rel="stylesheet" href="static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
          </svg>
        </div>
        <div class="brand-info">
          <h1 class="brand-title">Учебные Проекты</h1>
          <p class="brand-subtitle">Управление сметной документацией и заказами</p>
        </div>
      </div>
      <div class="header-stats">
        <span class="badge badge-accent" id="projectCountBadge">Загрузка...</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="content-container">

      <!-- Action Toolbar (Search, Filter, Create) -->
      <section class="toolbar-section" aria-label="Панель инструментов">
        <div class="toolbar" id="mainToolbar">
          <!-- Поиск -->
          <div class="search-box">
            <span class="search-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </span>
            <input 
              type="text" 
              id="searchInput" 
              class="search-input" 
              placeholder="Поиск по названию или описанию..." 
              autocomplete="off"
              aria-label="Поиск по проектам"
            >
            <button 
              type="button" 
              id="clearSearchBtn" 
              class="btn-clear hidden" 
              aria-label="Очистить поиск"
              title="Очистить поиск"
            >✕</button>
          </div>

          <!-- Фильтр по статусу -->
          <div class="filter-box">
            <select id="statusFilter" class="select-input" aria-label="Фильтрация по статусу">
              <option value="Все">Все статусы</option>
              <option value="В работе">В работе</option>
              <option value="Планирование">Планирование</option>
              <option value="На согласовании">На согласовании</option>
              <option value="Завершён">Завершён</option>
            </select>
          </div>

          <!-- Кнопка «Создать проект» -->
          <button type="button" id="openModalBtn" class="btn btn-primary btn-create">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Создать проект</span>
          </button>
        </div>
      </section>

      <!-- Active Filters Summary (Dynamic) -->
      <div id="filterSummary" class="filter-summary hidden">
        <span id="filterSummaryText"></span>
        <button type="button" id="resetFiltersBtn" class="btn-text">Сбросить</button>
      </div>

      <!-- Projects Grid -->
      <section class="projects-section" aria-label="Список проектов">
        <div id="projectsGrid" class="projects-grid">
          <!-- Карточки генерируются скриптом -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state hidden">
          <div class="empty-icon" aria-hidden="true">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
            </svg>
          </div>
          <h2 class="empty-title">Проекты не найдены</h2>
          <p class="empty-desc" id="emptyMessage">По вашему запросу ничего не нашлось. Попробуйте изменить параметры поиска или создайте новый проект.</p>
          <button type="button" id="emptyCreateBtn" class="btn btn-primary">
            + Создать проект
          </button>
        </div>
      </section>

    </div>
  </main>

  <!-- Modal: Создать проект -->
  <div id="projectModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle" class="modal-title">Создание нового проекта</h2>
        <button type="button" id="closeModalBtn" class="btn-close" aria-label="Закрыть окно">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <form id="projectForm" class="modal-form" novalidate>
        <div class="form-group">
          <label for="projectTitle" class="form-label">
            Название проекта <span class="required">*</span>
          </label>
          <input 
            type="text" 
            id="projectTitle" 
            name="title" 
            class="form-input" 
            placeholder="Например: Смета на разработку модуля AI" 
            required 
            maxlength="150"
          >
          <span class="field-error" id="titleError"></span>
        </div>

        <div class="form-group">
          <label for="projectDescription" class="form-label">Описание</label>
          <textarea 
            id="projectDescription" 
            name="description" 
            class="form-textarea" 
            rows="3" 
            placeholder="Краткое описание целей, состава работ или документации..."
            maxlength="500"
          ></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="projectStatus" class="form-label">Статус</label>
            <select id="projectStatus" name="status" class="form-select">
              <option value="В работе" selected>В работе</option>
              <option value="Планирование">Планирование</option>
              <option value="На согласовании">На согласовании</option>
              <option value="Завершён">Завершён</option>
            </select>
          </div>

          <div class="form-group">
            <label for="projectBudget" class="form-label">Смета / Бюджет (₽)</label>
            <input 
              type="number" 
              id="projectBudget" 
              name="budget" 
              class="form-input" 
              placeholder="0" 
              min="0" 
              step="1000"
            >
          </div>
        </div>

        <div id="formGlobalError" class="form-global-error hidden"></div>

        <div class="modal-actions">
          <button type="button" id="cancelModalBtn" class="btn btn-secondary">Отмена</button>
          <button type="submit" id="submitProjectBtn" class="btn btn-primary">
            <span>Сохранить проект</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="static/js/api.js"></script>
  <script src="static/js/app.js"></script>
</body>
</html>
